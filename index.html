
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>NetherFiles — Sua biblioteca de games</title>

  <style>
    :root {
      --bg: #080808;
      --panel: #111111;
      --panel-hover: #191919;
      --border: #292929;
      --text: #f5f5f5;
      --muted: #999999;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    header {
      padding: 32px 20px 24px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: #0b0b0b;
    }

    .logo {
      font-size: clamp(28px, 6vw, 42px);
      font-weight: 900;
      letter-spacing: 5px;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 9px;
      font-size: 14px;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 24px 16px 50px;
    }

    .search {
      width: 100%;
      padding: 15px 17px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: white;
      font-size: 16px;
      outline: none;
      margin-bottom: 18px;
    }

    .search:focus {
      border-color: #666;
    }

    .filters {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .filter {
      border: 1px solid var(--border);
      background: var(--panel);
      color: #ccc;
      padding: 9px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
    }

    .filter:hover,
    .filter.active {
      background: #eeeeee;
      color: #111;
      border-color: #eeeeee;
    }

    .section-title {
      font-size: 21px;
      margin-bottom: 17px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: transform .2s, border-color .2s;
      min-width: 0;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #666;
      background: var(--panel-hover);
    }

    .cover {
      height: 155px;
      background: #1b1b1b;
      position: relative;
      overflow: hidden;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .placeholder {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      font-size: 55px;
      background: linear-gradient(135deg, #252525, #101010);
    }

    .card-content {
      padding: 15px;
    }

    .category {
      display: inline-block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ddd;
      background: #252525;
      border: 1px solid #383838;
      padding: 5px 8px;
      border-radius: 5px;
      margin-bottom: 10px;
    }

    .card h3 {
      font-size: 17px;
      margin-bottom: 7px;
    }

    .platform {
      color: #aaa;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .description {
      color: #aaa;
      font-size: 13px;
      line-height: 1.5;
      min-height: 58px;
    }

    .card-link {
      display: block;
      margin-top: 15px;
      padding: 11px;
      text-align: center;
      background: #eeeeee;
      color: #111;
      text-decoration: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: bold;
    }

    .card-link:hover {
      background: #ccc;
    }

    .empty {
      grid-column: 1 / -1;
      color: var(--muted);
      text-align: center;
      padding: 40px 10px;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 24px 15px;
      text-align: center;
      color: #777;
      font-size: 12px;
    }

    @media (max-width: 850px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .cover {
        height: 125px;
      }

      .card-content {
        padding: 12px;
      }

      .card h3 {
        font-size: 15px;
      }

      .description {
        font-size: 12px;
      }
    }

    @media (max-width: 360px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .cover {
        height: 175px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">NETHERFILES</div>
    <p class="subtitle">Sua biblioteca de games</p>
  </header>

  <main>
    <input
      type="search"
      id="search"
      class="search"
      placeholder="🔎 Pesquisar jogos, apps e ferramentas..."
      aria-label="Pesquisar biblioteca"
    >

    <div class="filters">
      <button class="filter active" data-category="Todos">Todos</button>
      <button class="filter" data-category="Jogos">Jogos</button>
      <button class="filter" data-category="Emuladores">Emuladores</button>
      <button class="filter" data-category="Ferramentas">Ferramentas</button>
      <button class="filter" data-category="Apps">Apps</button>
      <button class="filter" data-category="Mods">Mods</button>
      <button class="filter" data-category="Ports">Ports</button>
    </div>

    <h2 class="section-title">Biblioteca</h2>
    <section id="grid" class="grid"></section>
  </main>

  <footer>
    <p>NetherFiles © 2026</p>
    <p style="margin-top:7px;">Sua biblioteca de games, em um só lugar.</p>
  </footer>

  <script>
    const games = [
      {
        name: "Fuzz TV",
        category: "Apps",
        platform: "Android",
        description: "Um app de streaming completo para assistir a conteúdos de entretenimento.",
        emoji: "📺",
        image: "fuzztv.png",
        url: "https://www.mediafire.com/file/eq69shm2dzrwq9z/fuzztv.apk/file"
      },
      {
        name: "Max Payne",
        category: "Jogos",
        platform: "PC · PlayStation 2 · Xbox",
        description: "Um clássico de ação noir, com tiroteios em câmera lenta e uma história sombria.",
        emoji: "🔫",
        image: "https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/12140/header.jpg",
        url: "https://store.steampowered.com/app/12140/Max_Payne/"
      },
      {
        name: "Resident Evil 4 (2005)",
        category: "Jogos",
        platform: "PC · PlayStation 2 · GameCube · Wii",
        description: "O clássico de sobrevivência e ação de Leon S. Kennedy, lançado originalmente em 2005.",
        emoji: "🧟",
        image: "re4.png",
        url: "https://www.residentevil.com/"
      },
      {
        name: "Minecraft",
        category: "Jogos",
        platform: "PC · Console · Mobile",
        description: "Explore mundos, construa estruturas e sobreviva à sua própria aventura.",
        emoji: "⛏️",
        image: "https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1672970/header.jpg",
        url: "https://www.minecraft.net/"
      },
      {
        name: "Stardew Valley",
        category: "Jogos",
        platform: "PC · Console · Mobile",
        description: "Construa sua fazenda, conheça os moradores e descubra os segredos do vale.",
        emoji: "🌱",
        image: "https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/413150/header.jpg",
        url: "https://www.stardewvalley.net/"
      },
      {
        name: "PPSSPP",
        category: "Emuladores",
        platform: "Android · PC",
        description: "Emulador de PSP para jogar seus jogos compatíveis em diferentes dispositivos.",
        emoji: "🎮",
        image: "",
        url: "https://www.ppsspp.org/"
      },
      {
        name: "Dolphin Emulator",
        category: "Emuladores",
        platform: "Android · PC",
        description: "Emulador de Nintendo GameCube e Wii.",
        emoji: "🐬",
        image: "",
        url: "https://dolphin-emu.org/"
      },
      {
        name: "RetroArch",
        category: "Emuladores",
        platform: "Android · PC · Console",
        description: "Uma plataforma que reúne vários núcleos de emulação em um só lugar.",
        emoji: "🕹️",
        image: "",
        url: "https://www.retroarch.com/"
      },
      {
        name: "PCSX2",
        category: "Emuladores",
        platform: "PC",
        description: "Emulador de PlayStation 2 para computadores compatíveis.",
        emoji: "🎮",
        image: "",
        url: "https://pcsx2.net/"
      },
      {
        name: "Winlator",
        category: "Ferramentas",
        platform: "Android",
        description: "Ferramenta para executar determinados aplicativos e jogos de Windows no Android.",
        emoji: "📱",
        image: "",
        url: "https://github.com/brunodev85/winlator"
      },
      {
        name: "Godot Engine",
        category: "Ferramentas",
        platform: "PC",
        description: "Crie seus próprios jogos com este motor de desenvolvimento gratuito e de código aberto.",
        emoji: "🛠️",
        image: "",
        url: "https://godotengine.org/"
      },
      {
        name: "Blender",
        category: "Ferramentas",
        platform: "PC",
        description: "Software de criação 3D para modelagem, animação e muito mais.",
        emoji: "🎨",
        image: "",
        url: "https://www.blender.org/"
      },
      {
        name: "NetherFiles Ports",
        category: "Ports",
        platform: "Várias plataformas",
        description: "Área para reunir ports e projetos de jogos adaptados para outras plataformas.",
        emoji: "📦",
        image: "",
        url: ""
      },
      {
        name: "NetherFiles Mods",
        category: "Mods",
        platform: "Vários jogos",
        description: "Área para reunir modificações, conteúdos extras e personalizações de jogos.",
        emoji: "🧩",
        image: "",
        url: ""
      }
    ];

    const grid = document.getElementById("grid");
    const search = document.getElementById("search");
    const filterButtons = document.querySelectorAll(".filter");

    let activeCategory = "Todos";

    function render() {
      const query = search.value.trim().toLowerCase();

      const filteredGames = games.filter(game => {
        const matchesSearch =
          game.name.toLowerCase().includes(query) ||
          game.category.toLowerCase().includes(query) ||
          game.platform.toLowerCase().includes(query) ||
          game.description.toLowerCase().includes(query);

        const matchesCategory =
          activeCategory === "Todos" ||
          game.category === activeCategory;

        return matchesSearch && matchesCategory;
      });

      if (filteredGames.length === 0) {
        grid.innerHTML = '<p class="empty">Nenhum resultado encontrado.</p>';
        return;
      }

      grid.innerHTML = filteredGames.map(game => {
        const cover = game.image
          ? `<img src="${game.image}" alt="Capa de ${game.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="placeholder">${game.emoji}</div>`
          : `<div class="placeholder" style="display:flex">${game.emoji}</div>`;

        const link = game.url
          ? `<a class="card-link" href="${game.url}" target="_blank" rel="noopener noreferrer">${game.name === "Fuzz TV" ? "Baixar APK ↗" : "Ver página ↗"}</a>`
          : `<span class="card-link" style="background:#292929;color:#aaa">Em breve</span>`;

        return `
          <article class="card">
            <div class="cover">${cover}</div>
            <div class="card-content">
              <span class="category">${game.category}</span>
              <h3>${game.name}</h3>
              <p class="platform">${game.platform}</p>
              <p class="description">${game.description}</p>
              ${link}
            </div>
          </article>
        `;
      }).join("");
    }

    search.addEventListener("input", render);

    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        activeCategory = button.dataset.category;

        filterButtons.forEach(item => {
          item.classList.toggle("active", item === button);
        });

        render();
      });
    });

    render();
  </script>
</body>
</html>
